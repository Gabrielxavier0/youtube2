<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css" />
    <script src="script.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="head">
      <button id="btn.menu"><i class="fa-solid fa-bars"></i></button>
      <img src="youtube.png" class="logo-youtube "alt=""/>
      <input type="text" />
      <img src="" alt="logo-usuario" />
    </header>

    <div class="main">
      <div class="video-box">
        <img src="hotwhells.avif" alt="img-video" class="img-video" />
        <p class="video">titulo do video</p>
        <div class="video-user">
          <div class="user">
            <img src="usuario.png" alt="img-usuario" />
            <div class="user-description">
              <p class="user-name">nome do usuario</p>
              <p class="user-subs">inscrito</p>
            </div>
          </div>
          <button class="subscribe">inscreva-se</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <aside class="menu" id="menu">
    <div class="menu-header">
      <p>menu</p>
      <button class="btn-close" id="btn.close">X</button>
      </div>
      <button id="btn.close"></button>
      
    </aside>
  </body>
</html>
